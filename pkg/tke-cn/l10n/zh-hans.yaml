tkeCn:
  label: 腾讯云 TKE
  description: 创建新的腾讯云 TKE (腾讯云 Kubernetes 版）集群或注册已有集群。
  updateWarn: 集群正在升级，编辑可能导致未知错误
  shortLabel: Tencent TKE
  region:
    label: 区域
  regions:
    ap-guangzhou: 广州
    ap-shanghai: 上海
    ap-beijing: 北京
    ap-chengdu: 成都
    ap-chongqing: 重庆
    ap-nanjing: 南京
    ap-hongkong: 中国香港
    ap-singapore: 新加坡
    na-toronto: 多伦多
    ap-bangkok: 曼谷
    ap-mumbai: 孟买
    ap-seoul: 首尔
    ap-tokyo: 东京
    na-siliconvalley: 硅谷
    na-ashburn: 弗吉尼亚
    eu-frankfurt: 法兰克福
    eu-moscow: 莫斯科
    ap-jakarta: 雅加达
    sa-saopaulo: 圣保罗
  container:
    label: 运行时组件
  clusterType:
    label: 集群类型
    independent: 独立集群
    managed: 托管集群
  clusterLevel:
    label: 集群规格
    help: "{level} (最多管理{node}个节点，{pod}个 Pod，{configMap}个 ConfigMap，{crd}个 CRD)"
  version:
    label: Kubernetes版本
    warning: "此版本不在 Rancher 支持矩阵范围内。可参考<a href='https://www.suse.com/suse-rancher/support-matrix/all-supported-versions' target='_blank' rel='noopener nofollow noreferrer'>Rancher 支持矩阵。</a>"
    warningTip: Rancher 支持矩阵。
  zone:
    label: 可用区
    required: 请选择可用区
  vpc:
    label: VPC
  subnet:
    label: 子网
  os:
    label: 操作系统
  clusterCidr:
    label: 容器网络 CIDR
    placeholder: '例如: 172.16.0.0/16'
    required: 请输入容器网络的CIDR
    formatError: 容器网络 CIDR 格式错误
  securityGroup:
    label: 安全组
    required: 请选择安全组
  ipvs:
    label: ipvs 支持
    enabled: 启用
    disabled: 停用
    help: IPVS适用于大规模场景下提供更优的转发性能。注意一经选择将不支持更改。
  proxy:
    label: 访问集群 APIServer
    inner: 内网访问
    outer: 外网访问
    info: 需要确保准备导入的集群已开启集群访问代理，且使用的安全组开放了443端口
  nodePoolName:
    label: 节点池名称
    placeholder: 例如：nodepool
    required: 必须设置 worker 节点池名称
    same: 节点池名称不唯一
  instanceType:
    label: 实例类型
  numOfNodes:
    label: Worker 节点数
    placeholder: '例如: 3'
    required: 必须设置Worker节点
    help: 此Kubernetes集群将运行的Worker节点数
  systemDiskSize:
    label: 系统盘大小
  systemDiskType:
    label: 系统盘类型
  dataDiskType:
    label: 数据盘类型
  dataDiskSize:
    label: 数据盘大小
  bandwidth:
    label: 带宽
    placeholder: '例如: 10'
  disk:
    LOCAL_BASIC: 本地硬盘
    LOCAL_SSD: 本地SSD硬盘
    CLOUD_BASIC: 普通云硬盘
    CLOUD_PREMIUM: 高性能云硬盘
    CLOUD_SSD: SSD云硬盘
    CLOUD_BSSD: 通用型SSD云硬盘
    CLOUD_TSSD: TSSD 云硬盘
    CLOUD_HSSD: 增强型SSD云硬盘
  bandwidthType:
    label: 带宽类型
    bandwidth: 按带宽计费
    traffic: 按使用流量计费
  keyPair:
    label: 密钥
    required: 请选择密钥
  clusterSelect:
    title: 选择集群
    detail: 选择要注册的 TKE 集群
    next: 注册集群
    importCluster: 集群
    required: 必须设置需要导入的集群
    placeholder: '请选择'
  master:
    title: Master&Etcd 节点配置
    detail: 配置用于启动腾讯云 Kubernetes 服务的主节点
  clusterVersion:
    upgradeTip: 当前集群版本为 {current}，可升级到更高版本（不支持降级）。
    latestTip: 当前集群版本为 {current}，已是可用的最新版本。
  domain:
    label: 集群域名
    placeholder: e.g. example.com
  nodePool:
    type:
      title: 节点池类型
      help: 选择节点池类型以进入对应的配置。
      more: 了解更多
      editTip: 节点池类型仅支持在创建时选择。
      badge:
        recommended: 推荐
      super:
        title: 超级节点
        desc: 超级节点是腾讯云首创的管理 Serverless 容器的 K8s 节点，具有秒级扩缩、Pod 间强隔离、细颗粒度计费等先进特性，同时兼容现有节点资源及预算管理流程。
        points:
          "0": 先进的 Serverless 理念与技术，运维工作轻量化
          "1": 单 Pod 独占轻量虚拟机，强隔离无干扰，安全稳定
          "2": 秒级扩缩容，轻松应对弹性需求，保障业务降低成本
          "3": 支持节点级管理，兼容现有运维工具、财务管理流程
      native:
        title: 普通节点
        desc: 普通节点基于腾讯云 CVM 产品提供底层计算能力，兼容社区 Kubernetes 能力，适用于定制化较强的业务场景。
        points:
          "0": 适配腾讯云 CVM 数十种机型实例
          "1": 基于腾讯云弹性伸缩服务提供自动扩缩容功能
          "2": Serverful 模式管理，用户对资源和运维的管控能力强
  superNodePool:
    basic:
      title: 节点池基础配置
      hint: 必须为节点池选择一个子网。
    config:
      title: 添加超级节点
      hint: 为保证集群正常运行，请添加超级节点。通过下方表格选择子网并填写节点名称，点击“{action}”后会生成一张配置卡片。点击卡片“编辑”可回填配置。
    fields:
      nodeName: 节点名称
      nodeNamePlaceholder: 自动生成
    actions:
      add: 添加超级节点
      save: 保存
      cancel: 取消
      edit: 编辑
      delete: 删除
    errors:
      subnetRequired: 必须选择子网
    subnetTable:
      name: 子网名称
      id: 子网ID
      cidr: CIDR
      zone: 可用区
      availableIp: 剩余IP数
    subnetEmpty: 暂无可用子网，请先选择区域/网络后再试。
    added:
      title: 已添加的节点
      empty: 暂无已添加节点配置。
      defaultNodeName: 节点{index}
    card:
      resourceType: 资源类型
      postpaid: 按量计费
      nodeNetwork: 节点网络
      availabilityZone: 可用区
    securityGroup:
      title: 安全组
      label: 安全组
      empty: 请选择至少一个安全组。
      actions:
        add: + 添加
        delete: 删除
    networkConfig:
      title: 网络配置
    advanced:
      title: 高级配置
      os: 操作系统
      deletionProtection: 删除保护
      osOptions:
        linux: Linux
        windows: Windows
      actions:
        add: + 添加
        delete: 删除
      fields:
        key: Key
        value: Value
        effect: Effect
      labels:
        title: Labels
        hint: 可选：为节点池添加标签。
      taints:
        title: Taints
        hint: 可选：设置污点用于调度控制。
      virtualNodeTags:
        title: Virtual Nodes Tags
        empty: 先在基础配置中添加虚拟节点。
        addTag: + 添加 Tag
        unconfigured: 未配置 Tags
        defaultNodeName: Virtual Node {index}
  csi:
    label: CSI 驱动
