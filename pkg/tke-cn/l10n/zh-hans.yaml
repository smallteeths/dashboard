      title: 其他配置
    type:
      title: 节点池类型
      help: 选择节点池类型以进入对应的配置。
      more: 了解更多
      editTip: 节点池类型仅支持在创建时选择。
      badge:
        recommended: 推荐
      super:
        title: 超级节点
        desc: 超级节点是腾讯云首创的管理 Serverless 容器的 K8s 节点，具有秒级扩缩、Pod 间强隔离、细颗粒度计费等先进特性，同时兼容现有节点资源及预算管理流程。
        points:
          "0": 先进的 Serverless 理念与技术，运维工作轻量化
          "1": 单 Pod 独占轻量虚拟机，强隔离无干扰，安全稳定
          "2": 秒级扩缩容，轻松应对弹性需求，保障业务降低成本
          "3": 支持节点级管理，兼容现有运维工具、财务管理流程
      native:
        title: 普通节点
        desc: 普通节点基于腾讯云 CVM 产品提供底层计算能力，兼容社区 Kubernetes 能力，适用于定制化较强的业务场景。
        points:
          "0": 适配腾讯云 CVM 数十种机型实例
          "1": 基于腾讯云弹性伸缩服务提供自动扩缩容功能
          "2": Serverful 模式管理，用户对资源和运维的管控能力强
