  csi:
    label: CSI 驱动
    description: 选择集群需要启用的存储组件。可按业务场景启用一个或多个 CSI 驱动。选择 COS 或 CFS 后，需要在腾讯云侧完成相应的 StorageClass / PersistentVolume 配置，完成后即可正常使用。
    cards:
      CBS:
        title: CBS
        desc: 提供腾讯云云硬盘存储能力，适用于块存储场景。
      COS:
        title: COS
        desc: 提供对象存储能力，适用于对象存储访问场景。
      CFSTurbo:
        title: CFSTurbo
        desc: 提供高性能文件存储能力，适用于高吞吐和低时延场景。
      CFS:
        title: CFS
        desc: 提供共享文件存储能力，适用于多节点共享挂载场景。
  basicConfig:
    title: 集群基础配置
    description: 配置腾讯云 TKE 集群的基础信息，包括地域、Kubernetes 版本和集群规格。集群规格决定可管理的节点与 Pod 数量上限，建议根据业务规模选择合适规格。
  networkConfig:
    title: 网络基础配置
    description: 配置腾讯云  TKE 集群的网络参数，包括可用区、VPC、子网、安全组、容器网络 CIDR，以及集群访问方式。根据业务需求和网络规划，合理配置这些参数，确保集群网络的正常运行。
