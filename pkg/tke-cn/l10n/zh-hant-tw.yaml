  csi:
    label: CSI 驅動
    description: 選擇叢集需要啟用的儲存組件。可依業務場景啟用一個或多個 CSI 驅動。選擇 COS 或 CFS 後，需要在騰訊雲端完成相應的 StorageClass / PersistentVolume 配置，完成後即可正常使用。
    cards:
      CBS:
        title: CBS
        desc: 提供騰訊雲雲硬碟儲存能力，適用於區塊儲存場景。
      COS:
        title: COS
        desc: 提供物件儲存能力，適用於物件儲存存取場景。
      CFSTurbo:
        title: CFSTurbo
        desc: 提供高效能檔案儲存能力，適用於高吞吐與低延遲場景。
      CFS:
        title: CFS
        desc: 提供共享檔案儲存能力，適用於多節點共享掛載場景。
  basicConfig:
    title: 集群基礎配置
    description: 配置腾讯云 TKE 集群的基礎信息，包括地域、Kubernetes 版本和集群规格。集群规格决定可管理的节点与 Pod 数量上限，建议根據業務規模選擇合適规格。
  networkConfig:
    title: 網路基礎配置
    description: 配置叢集網路相關參數，包括可用區、VPC、子網、安全組、容器網路 CIDR，以及叢集存取方式。請根據現有網路規劃與業務存取需求進行設定。
