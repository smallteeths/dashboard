      title: 其他配置
    type:
      title: 節點池類型
      help: 選擇節點池類型以進入對應的配置。
      more: 了解更多
      editTip: 節點池類型僅支援在建立時選擇。
      badge:
        recommended: 推薦
      super:
        title: 超級節點
        desc: 超級節點是騰訊雲首創的用於管理 Serverless 容器的 K8s 節點，具備秒級擴縮、Pod 間強隔離、細粒度計費等進階特性，同時相容現有節點資源及預算管理流程。
        points:
          "0": 先進的 Serverless 理念與技術，讓運維工作更輕量化
          "1": 單個 Pod 獨佔輕量虛擬機，強隔離、無干擾，安全穩定
          "2": 秒級擴縮容，輕鬆應對彈性需求，在保障業務的同時降低成本
          "3": 支援節點級管理，相容現有運維工具與財務管理流程
      native:
        title: 普通節點
        desc: 普通節點基於騰訊雲 CVM 產品提供底層運算能力，相容社群 Kubernetes 能力，適用於客製化需求較強的業務場景。
        points:
          "0": 適配騰訊雲 CVM 數十種機型實例
          "1": 基於騰訊雲彈性伸縮服務提供自動擴縮容功能
          "2": Serverful 模式管理，使用者對資源與運維具有更強的管控能力
