    latestTip: "Current cluster version is {current}. It is already the latest available version."
  domain:
    label: Domain
    placeholder: e.g. example.com
  nodePool:
    type:
      title: Node Pool Type
      help: Select a node pool type to proceed with the corresponding configuration.
      more: Learn More
      editTip: The node pool type can only be selected during creation.
      badge:
        recommended: Recommended
      super:
        title: Super Node
        desc: Super Node is Tencent Cloud’s pioneering Kubernetes node type for managing Serverless containers. It offers advanced capabilities such as second-level scaling, strong isolation between Pods, and fine-grained billing, while remaining compatible with existing resource and budget management workflows.
        points:
          "0": Advanced Serverless concepts and technologies for lighter operations
          "1": Each Pod exclusively occupies a lightweight virtual machine, providing strong isolation, no interference, and stable security
          "2": Second-level auto scaling to easily handle elastic workloads, ensuring business continuity while reducing costs
          "3": Supports node-level management and is compatible with existing operations tools and financial management processes
      native:
        title: Native Node
        desc: Native Node is built on Tencent Cloud CVM to provide underlying compute capacity, is compatible with community Kubernetes capabilities, and is suitable for business scenarios requiring stronger customization.
        points:
          "0": Supports dozens of Tencent Cloud CVM instance types
          "1": Provides auto scaling based on Tencent Cloud Auto Scaling Service
          "2": Serverful management model with stronger user control over resources and operations
