    CLOUD_PREMIUM: Cloud Premium
    CLOUD_SSD: Cloud SSD
    CLOUD_BSSD: CLOUD BSSD
    CLOUD_TSSD: CLOUD TSSD
    CLOUD_HSSD: CLOUD HSSD
  bandwidthType:
    label: Band Width Type
    bandwidth: Pay By Bandwidth
    traffic: Pay By Traffic
