      L500:
        title: Large - L500
        desc: High-concurrency high-performance requirements
      L1000:
        title: Large - L1000
        desc: High-concurrency high-performance requirements
      L3000:
        title: Large - L3000
        desc: High-concurrency high-performance requirements
