    required: Key Pair is required
  clusterSelect:
    title: Select Cluster
    detail: Select the TKE cluster to register
    next: Register cluster
    importCluster: Cluster
    required: The cluster to be imported must be set
    placeholder: Please select
  master:
    title: Master Nodes
    detail: Configure the master nodes that will be used to launch Tencent Kubernetes Service
  clusterVersion:
    upgradeTip: "Current cluster version is {current}. Upgrade to a higher version is supported (downgrades are not supported)."
    latestTip: "Current cluster version is {current}. It is already the latest available version."
  domain:
    label: Domain
    placeholder: e.g. example.com
    help: Please configure the public DNS service to resolve domain names.
  nodePool:
    basic:
      title: NodePool Configuration
      hint: Configure the basic node pool settings.
    network:
      title: Network Configuration
    other:
      title: Other Configuration
    type:
      title: Node Pool Type
      help: Select a node pool type to proceed with the corresponding configuration.
      more: Learn More
      editTip: The node pool type can only be selected during creation.
      badge:
        recommended: Recommended
      super:
        title: Super Node
        desc: Super Node is Tencent Cloud’s pioneering Kubernetes node type for managing Serverless containers. It offers advanced capabilities such as second-level scaling, strong isolation between Pods, and fine-grained billing, while remaining compatible with existing resource and budget management workflows.
        points:
          "0": Advanced Serverless concepts and technologies for lighter operations
          "1": Each Pod exclusively occupies a lightweight virtual machine, providing strong isolation, no interference, and stable security
          "2": Second-level auto scaling to easily handle elastic workloads, ensuring business continuity while reducing costs
          "3": Supports node-level management and is compatible with existing operations tools and financial management processes
      native:
        title: Native Node
        desc: Native Node is built on Tencent Cloud CVM to provide underlying compute capacity, is compatible with community Kubernetes capabilities, and is suitable for business scenarios requiring stronger customization.
        points:
          "0": Supports dozens of Tencent Cloud CVM instance types
          "1": Provides auto scaling based on Tencent Cloud Auto Scaling Service
          "2": Serverful management model with stronger user control over resources and operations
    deletionProtection:
      label: Node Pool Deletion Protection
      description: Prevent accidental deletion of this node pool.
  superNodePool:
    basic:
      title: NodePool Configuration
      titleHelp: Configure the current super node pool name.
      hint: A subnet must be selected for the node pool.
    config:
      title: Super Node
      hint: To keep the cluster running normally, add at least one super node. Select a subnet from the table below and enter a node name to create a configuration card. You can click Edit on the card at any time to load the configuration back for further changes.
    fields:
      nodeName: Node Name
      nodeNamePlaceholder: Auto-generated
    actions:
      add: Save Current Super Node and Add Super Node
      save: Save
      cancel: Cancel
      edit: Edit
      delete: Delete
    errors:
      subnetRequired: A subnet must be selected
    subnetTable:
      name: Subnet Name
      id: Subnet ID
      cidr: CIDR
      zone: Availability Zone
      availableIp: Available IPs
    subnetEmpty: No subnet is currently available. Please select a region or network first.
    added:
      title: Added Nodes
      empty: No node configuration has been added yet.
      defaultNodeName: Node {index}
    card:
      resourceType: Resource Type
      postpaid: Pay-as-you-go
      nodeNetwork: Node Network
      availabilityZone: Availability Zone
    securityGroup:
      title: Security Group
      label: Security Group
      empty: Please select at least one security group.
      actions:
        add: + Add
        delete: Delete
    networkConfig:
      title: Security Group Configuration
    advanced:
      title: Advanced Configuration
      os: Operating System
      deletionProtection: Deletion Protection
      osOptions:
        linux: Linux
        windows: Windows
      actions:
        add: + Add
        delete: Delete
      fields:
        key: Key
        value: Value
        effect: Effect
      labels:
        title: Labels
        hint: "Optional: add labels to the node pool."
      taints:
        title: Taints
        hint: "Optional: configure taints for scheduling control."
      virtualNodeTags:
        title: Virtual Node Tags
        empty: Add virtual nodes in the basic configuration first.
        addTag: + Add Tag
        unconfigured: No tags configured
        defaultNodeName: Virtual Node {index}
  csi:
    label: CSI Driver
    description: Select the storage components to enable for the cluster. One or more CSI drivers can be enabled based on workload requirements. After selecting COS or CFS, you need to complete the corresponding StorageClass / PersistentVolume configuration on the Tencent Cloud side before it can be used properly.
    cards:
      CBS:
        title: CBS
        desc: Provides Tencent Cloud block storage capability, suitable for block storage scenarios.
      COS:
        title: COS
        desc: Provides object storage capability, suitable for object storage access scenarios. 
      CFSTurbo:
        title: CFSTurbo
        desc: Provides high-performance file storage, suitable for high-throughput and low-latency scenarios.
      CFS:
        title: CFS
        desc: Provides shared file storage, suitable for multi-node shared mount scenarios.
  basicConfig:
    title: Cluster Basic Configuration
    description: Configure the basic settings of the Tencent Cloud TKE cluster, including region, Kubernetes version, and cluster level. The cluster level determines the maximum number of managed nodes and pods. Choose an appropriate level based on your workload size.
  networkConfig:
    title: Network Basic Configuration
    description: Configure the cluster network settings, including availability zone, VPC, subnet, security group, cluster CIDR, and cluster access method. Please configure them according to your network planning and access requirements.
  fields:
    help: Please complete the following required configuration fields.
    securityGroupIds: Super Node Security Group IDs
    virtualNodes: Super Nodes
    subnetId: Super Node Subnet ID
  userData:
    label: User Data
    preview: No user data configured
    description: Provide a custom cloud-init or shell script that will run during node initialization.
