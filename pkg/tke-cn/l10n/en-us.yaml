    formatError: Container Network CIDR format error
    conflictError: Container Network CIDR conflict error
  securityGroup:
    label: Security Group
    required: Security Group is required
  ipvs:
    label: IPVS Support
    enabled: Enabled
    disabled: Disabled
    help: IPVS can provide better service forwarding performance in large-scale workload scenarios. This setting is usually not changeable after cluster creation, so please choose carefully.
  proxy:
    label: Access cluster APIServer
    inner: Inner Net
    outer: Outer Net
    info: It is necessary to ensure that the cluster to be imported has the cluster access agent enabled and the security group used has opened port 443.
  nodePoolName:
    label: Node Pool Name
    placeholder: e.g. nodepool
    required: Worker Node Name is required
    same: Node pool name is not unique
