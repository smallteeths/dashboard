ackCn:
  label: 阿里雲 ACK
  description: 建立新的阿里雲 ACK（阿里雲容器服務 Kubernetes 版）叢集或註冊現有叢集。
  updateWarn: 集群正在升級，編輯可能導致未知錯誤
  changedHistoryK8sVerison: 集群版本變更之後，無法編輯節點池
  resourceGroup:
    label: 資源組
    all: 賬號全部資源
  region:
    label: 區域
  clusters:
    managed: 託管Kubernetes
    label: 叢集類型
  zone:
    label: 可用區
  version:
    label: Kubernetes版本
    warningAliyun: “{version}”，此版本阿里雲不在支持，如果繼續部署將會導致集群部署失敗，請更換其他版本。
    warningRacher: "此版本不在 Rancher 支持矩陣範圍內。可參考 可参考<a href='https://www.suse.com/suse-rancher/support-matrix/all-supported-versions' target='_blank' rel='noopener nofollow noreferrer'>Rancher 支持矩陣。</a>"
    warningRancherTip: Rancher 支持矩陣。
    warningEdited: 檢測到 Kubernetes 版本被修改，其他配置項將暫時不支持修改。歷史版本為 {vsersion}。
    toggle: 切換
  clusterSpec:
    pro: Pro 版
    standard: 基礎版本
    title: 叢集規格
    help: 選擇叢集的預設資源配額與能力等級。不同規格會影響可建立的叢集規模、可用功能以及適用情境。
    viewDetails: 查看規格詳情
    detailsTitle: 規格詳情
    badge:
      recommended: 推薦
    pill:
      devtest: 開發 / 測試
      production: 生產 / 發佈
    feature:
      quota: 配額
      capability: 能力
      support: 支援
    value:
      quota:
        standard: 標準
        high: 高
      capability:
        standard: 基礎
        full: 完整
      support:
        community: 社群支援
        sla: SLA 支援
    detail:
      scenario: 適用情境
      quota: 資源與規模
      capability: 功能範圍
      support: 支援等級
      change: 變更說明
    detailValue:
      standard:
        scenario: 適用於開發、測試與功能驗證等情境。
        quota: 滿足一般測試規模需求，適合小規模叢集與短週期驗證。
        capability: 提供基礎能力，適合日常開發與聯調。
        support: 提供社群支援與自助排障能力。
      pro:
        scenario: 適用於生產環境與關鍵業務工作負載。
        quota: 面向更高規模與更高併發情境，提供更充足的資源配額。
        capability: 提供更完整的生產能力與可維運性。
        support: 提供 SLA 支援與更高優先級的服務保障。
      common:
        change: 規格可在建立後升級；若需降級，請先確認業務影響與平台策略。
  vpcId:
    label: 專有網路
    prompt: 選擇專有網路...
    required: 必須選擇專有網路
    default: 默認專有網路
  vswitchId:
    label: 交換機
    prompt: 選擇交換機...
    required: 必須選擇交換機
    default: 默認交換機
  cni:
    title: 網路設定
    label: 網路外掛
    privateNetwork: 專有網路
    autoCreateVpc:
      label: 自動建立專有網路會自動建立 VPC/vSwitch
      autoCreateVpcTip: 自動建立專有網路
      useAlreadyCreatedVpcTip: 使用已建立的專有網路
    description:
      terway: Terway 是阿里雲自研的網路外掛，基於 ENI 實現 Pod 網路通訊，支援 eBPF 加速與 NetworkPolicy，並提供 Pod 級 vSwitch 與安全性群組能力。
      flannel: Flannel 是一種輕量級的 Overlay 網路方案，用於在 Kubernetes 叢集中提供 Pod 的跨節點連通性，讓不同節點上的 Pod 能夠彼此通訊。
  proxyMode:
    label: kube-proxy 代理模式
  nodeCidrMask:
    label: 節點 IP 數量
  containerCidr:
    label: Pod 網路 CIDR
    required: 必須輸入Pod 網路 CIDR
    invalid: Pod 網路 CIDR 網段格式不合法
    placeholder: "請填寫有效的私有網段，即以下網段及其子網：10.0.0.0/8，172.16-31.0.0/12-16，192.168.0.0/16。不能與VPC及VPC內已有kubernetes叢集使用的網段重複"
  serviceCidr:
    label: Service CIDR
    required: 必須輸入Service CIDR
    invalid: Service CIDR 網段不可選
    placeholder: "可選範圍：10.0.0.0/16-24，172.16-31.0.0/16-24，192.168.0.0/16-24。不能與VPC及VPC內已有kubernetes叢集使用的網段重複"
  snatEntry:
    label: 配置 SNAT
    placeholder: 為專有網路配置 SNAT
  endpointPublicAccess:
    label: 公網訪問
    placeholder: 使用 EIP 暴露 API Server
  nodePoolName:
    label: 節點池名稱
    placeholder: e.g. nodepool
    required: 必須設置worker節點池名稱
    unique: 节節點池名稱重复
  nodePool:
    name: 基本配置
    validation:
      number: "{key} 必須是數字。"
      integer: "{key} 必須是整數。"
      min: "{key} 必須大於或等於 {min}。"
      minLessThanOrEqualMax: "{key} 必須小於或等於 {max}。"
      maxGreaterThanOrEqualMin: "{key} 必須大於或等於 {min}。"
    scalingMode:
      label: 縮放模式
      manual: 手動
      auto: 自動
    desiredSize:
      label: 期望節點數
    minInstances:
      label: 最小實例數
    maxInstances:
      label: 最大實例數
    instanceTypes:
      list:
        title: 執行個體規格順序
        subtitle: 節點將依照執行個體規格的順序建立。若某個執行個體規格不可用，將自動改用下一個執行個體規格。實際用於建立節點的執行個體規格以庫存狀況為準。
        warning: 此執行個體規格在所選可用區中可能不可用。
      table:
        title: 執行個體規格
        subtitle: 請選擇一個或多個執行個體規格。節點將依照下方「執行個體規格順序」清單中的順序建立。
        add: 新增
        columns:
          instanceFamily: 執行個體族
          instanceType: 執行個體規格
          vcpus: vCPU
          memory: 記憶體
          stock: 庫存狀態
          zones: 可用區
        labelParts:
          vcpus: '{val} vCPU'
          memory: '{val} GB'
      cpu:
        label: vCPU 數量
        option: '{val} vCPU'
      memory:
        label: 記憶體
        option: '{val} GB'
      label: 執行個體規格
      banner: 選擇多個執行個體規格。節點將依照上方清單中的執行個體規格順序建立；當某個執行個體規格不可用時，將自動改用下一個執行個體規格。實際用於建立節點的執行個體規格以庫存狀況為準。
  diskCategory:
    label: 磁碟類型
    options:
      cloud: 普通云盘
      cloud_efficiency: 高效云盘
      cloud_ssd: SSD 云盘
      cloud_essd: ESSD 云盘
      cloud_auto: ESSD AutoPL 云盘
      cloud_essd_entry: ESSD Entry 云盘
      elastic_ephemeral_disk_standard: 標準弹性临时盘
      elastic_ephemeral_disk_premium: 高級弹性临时盘
    diskSize:
      label: 磁碟大小
    diskGroup:
      add: 新增磁碟
      remove: 移除磁碟
    diskEncrypted:
      label: 加密
    remove:
      label: 移除磁碟
    systemDisk:
      title: 系統碟
    dataDisks:
      title: 資料碟
  runtime:
    label: Containerd 版本
  instanceType:
    label: 實例類型
    required: 實例類型必須設置
    placeholder: 節點實例類型
  numOfNodes:
    label: Worker 節點數
    placeholder: '例如: 3'
    required: 實例數量必須大於或等於 0
  rootSize:
    label: 根磁碟大小
    placeholder: '例如: 120'
    minRequired: 磁碟大小必須大於或等於 10GB
  rootType:
    label: 根磁碟類型
    required: 根磁碟類型必須配置
  storageType:
    label: 數據磁碟類型
    required: 數據磁碟類型必須配置
    minRequired: 磁碟大小必須等於 0GB 或大於等於 10GB
  storageSize:
    label: 數據磁碟大小
    placeholder: '例如: 120'
  disk:
    cloud: 普通雲盤
    ephemeralSsd: 本地SSD盤
    efficiency: 高效雲盤
    ssd: SSD 雲盤
    essd: ESSD 雲盤
    cloudAuto: ESSD AutoPL 雲盤
    cloudessdentry: ESSD Entry 雲盤
  platform:
    label: 操作系統
  accessKeyId:
    label: 訪問秘鑰
    placeholder: 請輸入你的訪問秘鑰
    required: 訪問秘鑰必須輸入
  keyPair:
    label: 密鑰對
    required: 必須選擇密鑰對
  clusterSelect:
    title: 選擇叢集
    detail: 選擇要註冊的 ACK 叢集
    next: 註冊叢集
    importCluster: 叢集
    required: 必須設置需要導入的叢集
    placeholder: '請選擇'
  clusterBasicInfo:
    title: 叢集基本資訊
  fields:
    help: 請填寫以下必填配置項
  deletionProtection:
    label: 叢集刪除保護
    help: "開啟後，�集將被保護，防止被刪除。"
