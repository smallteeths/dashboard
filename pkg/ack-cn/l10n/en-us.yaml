ackCn:
  label: Alibaba ACK
  description: Provision new Alibaba ACK (ACK Kubernetes Service) clusters or register existing ones.
  updateWarn: The cluster is currently being upgraded, and editing may result in unknown errors.
  changedHistoryK8sVerison: After the cluster version changes, the node pool cannot be edited.
  resourceGroup:
    label: Resource Group
    all: Account's all Resources
  region:
    label: Region
  clusters:
    managed: Managed Kubernetes
    label: Cluster Type
  zone:
    label: Zone
  version:
    label: Kubernetes Version
    warningAliyun: “{version}”, Ali Cloud is not supported in this version. If you continue to deploy it, cluster deployment will fail, please replace it with another version.
    warningRacher: "This version is not supported by Rancher. Reference <a href='https://www.suse.com/suse-rancher/support-matrix/all-supported-versions' target='_blank' rel='noopener nofollow noreferrer'>Rancher support matrix.</a>"
    warningRancherTip: Rancher supported versions.
    warningEdited: It is detected that the Kubernetes version has been modified, and other configuration items will not support modification temporarily. Historical version is {vsersion}。
    toggle: Switch Mode
  clusterSpec:
    pro: Pro Edition
    standard: Standard Edition
    title: Cluster Specification
    help: Select the default resource quotas and capability level for the cluster. Different specifications affect the cluster scale you can create, available features, and intended use cases.
    viewDetails: details
    detailsTitle: Specification Details
    badge:
      recommended: Recommended
    pill:
      devtest: Dev / Test
      production: Production / Release
    feature:
      quota: Quota
      capability: Capabilities
      support: Support
    value:
      quota:
        standard: Standard
        high: High
      capability:
        standard: Basic
        full: Full
      support:
        community: Community Support
        sla: SLA Support
    detail:
      scenario: Use cases
      quota: Resources and scale
      capability: Feature scope
      support: Support level
      change: Change notes
    detailValue:
      standard:
        scenario: Suitable for development, testing, and feature validation.
        quota: Meets typical test-scale needs and is ideal for small clusters and short-cycle validation.
        capability: Provides essential capabilities for day-to-day development and integration.
        support: Includes community support and self-service troubleshooting.
      pro:
        scenario: Suitable for production environments and mission-critical workloads.
        quota: Designed for larger scale and higher concurrency, with more generous resource quotas.
        capability: Offers a more complete set of production-grade capabilities and operability.
        support: Provides SLA-backed support with higher-priority service assurance.
      common:
        change: The specification can be upgraded after creation. For downgrades, please confirm business impact and platform policies.
  vpcId:
    label: VPC
    prompt: Choose VPC...
    required: VPC is required
    default: Default VPC
  vswitchId:
    label: VSwitch
    prompt: Choose VSwitch...
    required: VSwitch is required
    default: Default VSwitch
  cni:
    title: Network Configuration
    label: Network Plugin
    privateNetwork: Private Network
    autoCreateVpc:
      label: Automatically creating a private network will create the VPC and vSwitch automatically.
      autoCreateVpcTip: Automatically create a private network
      useAlreadyCreatedVpcTip: Use an existing private network
    description: 
      terway: Terway is Alibaba Cloud’s self-developed networking plugin. It uses ENIs to provide Pod networking, supports eBPF acceleration and NetworkPolicy, and enables Pod-level vSwitch and security group capabilities.
      flannel: Flannel is a lightweight overlay networking solution that provides cross-node connectivity for Pods in a Kubernetes cluster, enabling Pod-to-Pod communication across different nodes.
  proxyMode:
    label: Kube-Proxy Mode
  nodeCidrMask:
    label: IP Addresses per Node
  containerCidr:
    label: Pod CIDR Block
    required: Pod CIDR Block is required
    invalid: Pod CIDR Block is invalid
    placeholder: "Specify a valid CIDR block that contains only internal IP addresses, namely one of the following CIDR blocks or their subnets: 10.0.0.0/8 172.16-31.0.0/12-16 and 192.168.0.0/16.Cannot be duplicated with the VPC and the network segment used by the existing kubernetes cluster in the VPC"
  serviceCidr:
    label: Service CIDR
    required: Service CIDR is required
    invalid: Service CIDR is invalid
    placeholder: "Valid CIDR blocks include: 10.0.0.0/8 172.16-31.0.0/12-16 and 192.168.0.0/16.Cannot be duplicated with the VPC and the network segment used by the existing kubernetes cluster in the VPC"
  snatEntry:
    label: Configure SNAT
    placeholder: Configure SNAT for VPC
  endpointPublicAccess:
    label: Public Access
    placeholder: Expose API Server with EIP
  nodePoolName:
    label: Nood Pool Name
    placeholder: e.g. nodepool
    required: Worker Node Name is required
    unique: Node pool names must be unique.
  nodePool:
    name: Basic Configuration
    validation:
      number: "{key} must be a number."
      integer: "{key} must be an integer."
      min: "{key} must be greater than or equal to {min}."
      minLessThanOrEqualMax: "{key} must be less than or equal to {max}."
      maxGreaterThanOrEqualMin: "{key} must be greater than or equal to {min}."
    scalingMode: 
      label: Scaling Mode
      manual: Manual
      auto: Auto
    desiredSize:
      label: Expected Nodes
    minInstances:
      label: Min Instances
    maxInstances:
      label: Max Instances
    instanceTypes:
      list:
        title: Instance Type Order
        subtitle: Nodes are created based on the order of the instance types. If one instance type is unavailable, the next instance type is used. The actual instance types used to create nodes are subject to inventory availability.
        warning: This instance type might be unavailable in selected zones.
      table:
        title: Instance Types
        subtitle: Select one or more instance types. Nodes are created based on the order of the instance types in the Instance Order list below.
        add: Add
        columns:
          instanceFamily: Instance Family
          instanceType: Instance Type
          vcpus: vCPU
          memory: Memory  
          stock: Stock Availability 
          zones: Zones  
        labelParts:
          vcpus: '{val} vCPU'
          memory: '{val} GB'         
      cpu:
        label: Number of vCPUs
        option: '{val} vCPU'
      memory:
        label: Memory
        option: '{val} GB'
      label: Instance Types
      banner: You can select multiple instance types. Nodes are created based on the order of the instance types in the above list. If one instance type is unavailable, the next instance type is used. The actual instance types used to create nodes are subject to inventory availability.
    diskCategory:
      label: Category
      options:
        cloud: Basic Disk
        cloud_efficiency: Ultra Disk
        cloud_ssd: Standard SSD Disk
        cloud_essd: ESSD Disk
        cloud_auto: ESSD AutoPL Disk
        cloud_essd_entry: ESSD Entry Disk
        elastic_ephemeral_disk_standard: Standard Elastic Ephemeral Disk
        elastic_ephemeral_disk_premium: Premium Elastic Ephemeral Disk
    diskSize:
      label: Disk size
    diskGroup:
      add: Add disk
      remove: Remove disk
    diskEncrypted:
      label: Encryption
    remove:
      label: Remove Disk
    systemDisk:
      title: System Disk
    dataDisks:
      title: Data Disks
  runtime:
    label: Containerd Version
  instanceType:
    label: Instance Type
    required: Instance Type is required
    placeholder: Configure instance type for node
  numOfNodes:
    label: Worker Nodes Count
    placeholder: e.g. 3
    minRequired: The number of instances must be greater than or equal to 0.
  rootSize:
    label: Root Disk Size
    placeholder: e.g. 120
    minRequired: The number of disk size must be greater than or equal to 10 GB.
  rootType:
    label: Root Disk Type
    required: Root Disk Type is required
  storageType:
    label: Data Disk Type
    required: Data Disk Type is required
  storageSize:
    label: Data Disk Size
    placeholder: e.g. 120
    minRequired: Disk size must be either 0 GB or at least 10 GB.
  disk:
    cloud: Ordinary Disk
    ephemeralSsd: Local SSD Disk
    efficiency: Ultra Disk
    ssd: SSD Disk
    essd: ESSD Disk
    cloudAuto: ESSD AutoPL Disk
    cloudessdentry: ESSD Entry Disk
  platform:
    label: Operating System
  keyPair:
    label: Key Pair
    required: Key Pair is required
  clusterSelect:
    title: Select Cluster
    detail: Select the ACK cluster you want to register
    next: Register Cluster
    importCluster: Cluster
    required: Import Cluster is required
    placeholder: 'Choose'
  generic:
    arrayList: Array List
    moveUp: Move Up
    moveDown: Move Down
    remove: Remove
